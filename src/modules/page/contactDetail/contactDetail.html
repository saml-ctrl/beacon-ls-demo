<template>
    <div class="slds-p-horizontal_medium">
        <template lwc:if={hasContact}>
            <ui-page-header
                variant="record-home"
                icon-name="standard:contact"
                object-label="Contact"
                title={contact.name}
                fields={headerFields}>
                <div slot="actions">
                    <lightning-button-group>
                        <lightning-button label="Edit" variant="neutral"></lightning-button>
                        <lightning-button label="Log a Call" variant="neutral"></lightning-button>
                        <lightning-button label="New Task" variant="neutral"></lightning-button>
                    </lightning-button-group>
                </div>
            </ui-page-header>

            <div class="slds-m-top_small">
                <lightning-tabset active-tab-value="details">
                    <lightning-tab label="Details" value="details">
                        <lightning-card title="Contact Details" icon-name="standard:contact">
                            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                                <template lwc:if={contact.enriched}>
                                    <div class="slds-m-bottom_small">
                                        <lightning-badge label="Verified by Clay" icon-name="utility:success"></lightning-badge>
                                    </div>
                                </template>
                                <ui-detail-grid fields={detailFields}></ui-detail-grid>
                                <lightning-button
                                    class="slds-m-top_x-small"
                                    variant="base"
                                    label="Open Account"
                                    onclick={handleAccountClick}>
                                </lightning-button>
                            </div>
                        </lightning-card>
                        <div class="slds-m-top_small">
                            <ui-integration-badge
                                label="Clay → Salesforce (managed package)"
                                direction="inbound"
                                note="On-demand and one-time-on-assignment enrichment only — no bulk enrichment.">
                            </ui-integration-badge>
                        </div>
                    </lightning-tab>
                    <lightning-tab label="Related" value="related">
                        <lightning-card title="Opportunities" icon-name="standard:opportunity">
                            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                                <template lwc:if={hasRelatedOpps}>
                                    <ul>
                                        <template for:each={relatedOpps} for:item="item">
                                            <li key={item.id} class="slds-m-bottom_xx-small">
                                                <lightning-button
                                                    variant="base"
                                                    label={item.oppName}
                                                    data-opp-id={item.oppId}
                                                    onclick={handleOppClick}>
                                                </lightning-button>
                                                <lightning-badge class="slds-m-left_x-small" label={item.role}></lightning-badge>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-color_weak slds-text-body_small">No Opportunity Contact Roles yet.</p>
                                </template>
                            </div>
                        </lightning-card>
                    </lightning-tab>
                    <lightning-tab label="Engagement History" value="engagement">
                        <lightning-card title="Engagement History — Marketing Cloud Account Engagement" icon-name="standard:campaign">
                            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                                <template lwc:if={hasEngagement}>
                                    <ul class="slds-timeline">
                                        <template for:each={engagement} for:item="item">
                                            <li key={item.id} class="slds-timeline__item">
                                                <div class="slds-media slds-m-bottom_small">
                                                    <div class="slds-media__figure">
                                                        <lightning-icon icon-name={item.iconName} size="small" alternative-text={item.type}></lightning-icon>
                                                    </div>
                                                    <div class="slds-media__body">
                                                        <div class="slds-grid slds-grid_align-spread">
                                                            <p><strong>{item.subject}</strong></p>
                                                            <p class="slds-text-body_small slds-text-color_weak slds-no-flex">{item.time}</p>
                                                        </div>
                                                        <p class="slds-text-body_small slds-m-top_xx-small">{item.detail}</p>
                                                    </div>
                                                </div>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-color_weak slds-text-body_small">No engagement activity synced yet.</p>
                                </template>
                            </div>
                        </lightning-card>
                        <div class="slds-m-top_small">
                            <ui-integration-badge
                                label="Marketing Cloud Account Engagement ↔ Salesforce"
                                direction="sync"
                                note="Engagement data inbound to the Contact timeline (opens, form fills, campaign membership).">
                            </ui-integration-badge>
                        </div>
                    </lightning-tab>
                </lightning-tabset>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_large slds-text-align_center">
                <p class="slds-text-heading_medium">Contact not found</p>
                <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                    The journey KOL Contacts are created by the custom Lead Conversion (journey step 4).
                </p>
                <div class="slds-m-top_small">
                    <lightning-button label="Back to Contacts" variant="brand" onclick={handleBackToList}></lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
